name: Mobile CI

on:
  push:
    branches: ["*"]
  pull_request:
    branches: ["*"]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20.x
          cache: 'npm'
          cache-dependency-path: apps/mobile/package-lock.json

      # TODO: remove --legacy-peer-deps once expo-three/@expo/browser-polyfill is compatible with RN 0.79.x or dependency is removed
      - name: Install dependencies
        working-directory: apps/mobile
        run: npm ci --no-audit --legacy-peer-deps

      - name: Format check
        working-directory: apps/mobile
        run: npm run format:check

      - name: Lint colors
        working-directory: apps/mobile
        run: npm run lint:colors

      - name: Typecheck
        working-directory: apps/mobile
        run: npm run typecheck

      - name: Test
        working-directory: apps/mobile
        run: npm test
